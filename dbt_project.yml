
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'finance_cdm'
version: "1.0.0"
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: "default"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target" # directory which will store compiled SQL files
clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run
# dbt run or dbt build, all of your models will be built as a view in your data platform.
# The configuration below will override this setting for models in the example folder to
# instead be materialized as tables. Any models you add to the root of the models folder will
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.
vars:
  source_database: "{{ env_var('DBT_FINANCE_CDM_SOURCE_DATABASE','DATA_PLATFORM_DB') }}"
  source_schema_netsuite: "{{ env_var('DBT_SOURCE_SCHEMA_NETSUITE', 'GOLD_NETSUITE') }}"
  source_schema_sage: "{{ env_var('DBT_SOURCE_SCHEMA_SAGE', 'GOLD_SAGE') }}"

  # Destination (write side), include environment in database name only i.e. analytics_dev/analytics_CI etc.
  dest_database: "{{ env_var('DBT_FINANCE_CDM_DEST_DATABASE', 'DATA_PLATFORM_DB') }}"
  reporting_schema: "{{ env_var('DBT_SILVER_SCHEMA_CDM_FINANCE', 'CDM_FINANCE') }}"


 
# Global variables (vars) 

vars:
  tool_name: "{{ env_var('TOOL_NAME', 'fivetran') }}"
  surrogate_key_treat_nulls_as_empty_strings: True

# Incremental filter (vars)

  source_database: "{{ env_var('DBT_FINANCE_CDM_SOURCE_DATABASE','DATA_PLATFORM_DB') }}"

  netsuite_gold_schema: "{{ env_var('DBT_GOLD_SCHEMA_NETSUITE', 'GOLD_NETSUITE') }}"
  netsuite_silver_schema: "{{ env_var('DBT_SILVER_SCHEMA_NETSUITE', 'SILVER_NETSUITE') }}"

  sage_gold_schema: "{{ env_var('DBT_GOLD_SCHEMA_SAGE', 'GOLD_SAGE') }}"
  sage_silver_schema: "{{ env_var('DBT_SILVER_SCHEMA_SAGE', 'SILVER_SAGE') }}"

  # Destination (write side), include environment in database name only i.e. analytics_dev/analytics_CI etc.
  dest_database: "{{ env_var('DBT_FINANCE_CDM_DEST_DATABASE', 'DATA_PLATFORM_DB') }}"
  reporting_schema: "{{ env_var('DBT_REPORTING_SCHEMA', 'CDM_FINANCE') }}"

models:
  finance_cdm:
    reporting:
      +database: "{{ env_var('DBT_FINANCE_CDM_DEST_DATABASE', 'DATA_PLATFORM_DB') }}"
      +schema: "{{ env_var('DBT_REPORTING_SCHEMA', 'CDM_FINANCE') }}"
      +on_schema_change: append_new_columns
      +materialized: table


# ------------------------------------------------------------------------------
# Snapshot configuration
# ------------------------------------------------------------------------------

snapshots:
  finance_cdm:
    +target_database: "{{ env_var('DBT_FINANCE_CDM_DEST_DATABASE', 'DATA_PLATFORM_DB') }}"
    +target_schema: "{{ env_var('DBT_SNAPSHOT_SCHEMA', 'CDM_SNAPSHOTS') }}"
    +strategy: timestamp
    +invalidate_hard_deletes: true


# ------------------------------------------------------------------------------
# Snowflake identifier behavior (recommended)
# ------------------------------------------------------------------------------

quoting:
  database: false
  schema: false
  identifier: false